# Checks every push to main and every pull request (docs/Development.md §8).
# No secrets are used: the backend tests run in convex-test, and the site builds against a
# placeholder URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convex:
    name: Backend (types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: convex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: convex/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run

  dashboard:
    name: Site (types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # The session token lives in localStorage, so injected HTML would let a script steal it.
      # React escapes text; only raw-HTML APIs bypass that (docs/Security.md).
      - name: No raw HTML in the site
        run: |
          if grep -rnE "dangerouslySetInnerHTML|\.innerHTML\s*=|\.outerHTML\s*=|insertAdjacentHTML|document\.write" src; then
            echo "::error::Raw HTML found in dashboard/src. Render text with React instead."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_CONVEX_URL: https://ci-placeholder.convex.cloud

  agent:
    name: Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
