# Nexus agent config.
# Copy to config.toml (gitignored). The device secret is generated on first run.

# Convex deployment URL. Ask the project owner; it is kept out of the repo.
convex_url = "https://YOUR-DEPLOYMENT.convex.cloud"

# Team registration secret. Ask the other team member privately; never commit it.
# registration_secret = "paste-here"

# Seconds between live pushes while a viewer is present (FR-31).
live_interval_secs = 1

# Activity data: top process names (by memory) and boot/sleep/wake times.
# Shown on your dashboard only. Set to false to stop sending it. See docs/PRIVACY.md.
# share_activity = true

# Autonomous auto-updates: checks GitHub Releases and updates in the background.
# Set to false to disable background updates.
# auto_update = true
